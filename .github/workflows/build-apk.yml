name: Build MotivaAI APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'lib/**'
      - 'pubspec.yaml'
      - '.github/workflows/**'

permissions:
  contents: read

concurrency:
  group: motivaai-apk-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Create Android project files
        run: flutter create . --platforms=android --org com.motivaai
      - name: Set Android minimum SDK for FFmpeg
        run: sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 24/' android/app/build.gradle.kts
      - name: Enable long-running daily generation worker
        run: |
          echo 'workmanager.enableDataSyncForegroundService=true' >> android/gradle.properties
          python3 - <<'PY'
          from pathlib import Path
          p=Path('android/app/src/main/AndroidManifest.xml')
          s=p.read_text()
          s=s.replace('<application', '<uses-permission android:name="android.permission.INTERNET"/>\\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>\\n    <queries><intent><action android:name="android.intent.action.TTS_SERVICE"/></intent></queries>\\n    <application', 1)
          p.write_text(s)
          PY
      - name: Install packages
        run: flutter pub get
      - name: Build release APK
        run: flutter build apk --release
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MotivaAI-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
